services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "43124:43124"
    volumes:
      - loopbench-data:/data
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        API_ORIGIN: http://api:43124
    ports:
      - "43123:43123"
    depends_on:
      - api

volumes:
  loopbench-data:
