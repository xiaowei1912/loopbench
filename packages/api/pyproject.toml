[project]
name = "loopbench-api"
version = "0.1.0"
description = "HTTP API for the Loopbench evaluation loop."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "loopbench-spec>=0.1",
  "loopbench-evalkit>=0.1",
  "loopbench-transport>=0.1",
  "loopbench-sim-reference>=0.1",
  "loopbench-sim-mujoco>=0.1",
  "loopbench-policies>=0.1",
  "loopbench-adapters>=0.1",
  "loopbench-bridges>=0.1",
  "loopbench-example-suite>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loopbench_api*"]
