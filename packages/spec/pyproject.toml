[project]
name = "loopbench-spec"
version = "0.1.0"
description = "Shared contracts for the Loopbench evaluation loop. No simulator, no policy."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loopbench_spec*"]
