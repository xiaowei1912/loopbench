[project]
name = "loopbench-evalkit"
version = "0.1.0"
description = "Evaluation, failure analysis, scenario generation, and the closed loop."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10.4", "loopbench-spec>=0.1"]

[project.entry-points."loopbench.suites"]
tabletop_probe = "loopbench_evalkit.suites:probe"
tabletop_mini = "loopbench_evalkit.suites:mini"
tabletop_v1 = "loopbench_evalkit.suites:v1"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loopbench_evalkit*"]
