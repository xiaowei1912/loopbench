[project]
name = "loopbench-cli"
version = "0.1.0"
description = "CLI for Loopbench."
requires-python = ">=3.11"
dependencies = [
  "uvicorn>=0.32",
  "loopbench-api>=0.1",
  "loopbench-evalkit>=0.1",
  "loopbench-spec>=0.1",
]

[project.scripts]
loopbench = "loopbench_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loopbench_cli*"]
